repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: schema-docs
        name: regenerate schema diagrams and model pages
        entry: uv run python generate_schema_diagram.py
        language: system
        pass_filenames: false
        files: ^(packages/temdb(-models)?/src/|generate_schema_diagram\.py$)
      - id: openapi
        name: regenerate openapi.json
        entry: bash -c 'uv run temdb-openapi > openapi.json'
        language: system
        pass_filenames: false
        files: ^packages/temdb(-models)?/src/
