[project]
name = "temdb-client"
version = "4.0.0"
description = "Python client SDK for TEMdb API"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "httpx>=0.28,<1",
    "temdb-models==4.0.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temdb"]
