[project]
name = "temdb"
version = "2.0.0"
description = "TEMdb - Metadata database server"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.1.0b2",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "uuid-utils>=0.16",
    "fastapi>=0.136",
    "uvicorn>=0.49",
    "temdb-models>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temdb"]
