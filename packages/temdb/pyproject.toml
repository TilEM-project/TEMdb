[project]
name = "temdb"
version = "2.0.0"
description = "TEMdb - Metadata database server"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.1.0b2",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "uuid-utils>=0.16",
    "fastapi>=0.136",
    "uvicorn>=0.49",
    "temdb-models==2.0.0",
]

[project.scripts]
temdb-server = "temdb.server.cli:server_main"
temdb-migrate = "temdb.server.cli:migrate_main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temdb"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "temdb/migrations"
"alembic.ini" = "temdb/alembic.ini"
