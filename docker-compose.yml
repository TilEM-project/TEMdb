services:
  postgres:
    image: postgres:18
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    env_file:
      - ./dev.env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15

  adminer:
    image: adminer:latest
    ports:
      - 8080:8080
    depends_on:
      - postgres

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic -c packages/temdb/alembic.ini upgrade head
    environment:
      PYTHONPATH: /app/packages/temdb-models/src:/app/packages/temdb/src
    volumes:
      - ./packages:/app/packages
    env_file:
      - ./dev.env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn run:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    environment:
      PYTHONPATH: /app/packages/temdb-models/src:/app/packages/temdb/src
    ports:
      - 8000:8000
    volumes:
      - ./packages:/app/packages
      - ./run.py:/app/run.py
    env_file:
      - ./dev.env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
