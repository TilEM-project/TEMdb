[tool.bumpversion]
current_version = "4.0.0rc1"
parse = '''(?x)
    ^(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)
    (?:(?P<pre_l>rc)(?P<pre_n>\d+))?$
'''
serialize = [
    "{major}.{minor}.{patch}{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"
pre_commit_hooks = [
    "uv lock",
    "uv run temdb-contract-check --record",
    "git add uv.lock contract/openapi.released.json",
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "packages/temdb-models/pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "packages/temdb-client/pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "packages/temdb/pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

# Also update the dependency pins
[[tool.bumpversion.files]]
filename = "packages/temdb-client/pyproject.toml"
search = "temdb-models=={current_version}"
replace = "temdb-models=={new_version}"

[[tool.bumpversion.files]]
filename = "packages/temdb/pyproject.toml"
search = "temdb-models=={current_version}"
replace = "temdb-models=={new_version}"

[[tool.bumpversion.files]]
filename = "openapi.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

[tool.bumpversion.parts.pre_l]
values = ["final", "rc"]
optional_value = "final"
