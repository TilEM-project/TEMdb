name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check LICENSE copies are in sync
        run: |
          for p in temdb-models temdb-client temdb; do
            diff -q LICENSE "packages/$p/LICENSE" || exit 1
          done

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: API changes since the last release
        run: |
          set -o pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run temdb-contract-check | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group docs

      - name: Check the schema diagrams and model pages are current
        run: |
          uv run python generate_schema_diagram.py
          git add -N docs
          git diff --exit-code docs || { echo "Run: uv run python generate_schema_diagram.py"; exit 1; }

      - name: Build
        run: uv run mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest --cov -n auto
