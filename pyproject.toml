[project]
name = "temdb-workspace"
version = "2.0.0"
description = "TEMdb monorepo workspace"
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.10",
    "smart-open[s3]>=7.6",
]

[tool.uv.workspace]
members = [
    "packages/temdb-models",
    "packages/temdb-client",
    "packages/temdb",
]

[tool.uv.sources]
temdb-models = { workspace = true }
temdb-client = { workspace = true }
temdb = { workspace = true }

[dependency-groups]
dev = [
    "temdb-models",
    "temdb-client",
    "temdb",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "testcontainers>=4.14",
    "ruff>=0.15",
    "faker>=40.0",
    "bump-my-version>=1.3",
    "pre-commit>=4.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# autogenerated DDL; long lines are not worth fixing on every revision
"packages/temdb/migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["temdb", "temdb_models", "temdb_client"]
