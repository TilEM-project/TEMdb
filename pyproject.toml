[project]
name = "temdb-workspace"
version = "3.0.0"
description = "TEMdb monorepo workspace"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
]
[tool.uv.workspace]
members = [
    "packages/temdb-models",
    "packages/temdb-client",
    "packages/temdb",
]

[tool.uv.sources]
temdb-models = { workspace = true }
temdb-client = { workspace = true }
temdb = { workspace = true }

[dependency-groups]
dev = [
    "temdb-models",
    "temdb-client",
    "temdb",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "testcontainers[minio]>=4.14",
    "ruff>=0.15",
    "faker>=40.0",
    "bump-my-version>=1.3",
    "pre-commit>=4.6",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocs-swagger-ui-tag>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--strict-markers -n auto"
markers = ["db: needs the testcontainers Postgres (Docker)"]

[tool.coverage.run]
source_pkgs = ["temdb.models", "temdb.client", "temdb.server"]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# autogenerated DDL; long lines are not worth fixing on every revision
"packages/temdb/migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["temdb", "temdb_models", "temdb_client"]
